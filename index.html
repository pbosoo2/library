<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>별빛 수집가의 마법 도서관</title>
<style>
:root{--ink:#211d37;--muted:#706b84;--paper:#fffdf8;--line:#e8e1d4;--violet:#7867c8;--violet-soft:#eeeafd;--gold:#bd8a3c;--night:#171427;--shadow:0 18px 60px rgba(39,31,67,.12)}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 8% 5%,#efeaff 0,transparent 28%),radial-gradient(circle at 92% 10%,#fff0d2 0,transparent 26%),#f7f3ec;min-height:100vh}.stars{position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(#806ec9 1px,transparent 1px),radial-gradient(#c59648 1px,transparent 1px);background-size:74px 74px,113px 113px;background-position:0 0,37px 21px}.shell{position:relative;max-width:1120px;margin:auto;padding:32px 28px 56px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;gap:10px;align-items:center;font-family:Georgia,serif;font-weight:700;letter-spacing:.03em}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border:1px solid #d8cda9;border-radius:50%;background:#fffaf0;color:var(--gold)}.source{font-size:14px;color:var(--muted)}.hero{overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:38px 42px;color:#fff;background:linear-gradient(125deg,#1d1933 0%,#30275a 55%,#5a4072 100%);box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;right:58px;top:46px;width:92px;height:92px;border:10px solid rgba(255,255,255,.055);outline:2px solid rgba(255,255,255,.055);outline-offset:12px;border-radius:50%}.eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#d8cef7}.hero h1{font:700 2em/1.15 Georgia,"Noto Serif KR",serif;margin:0 0 12px;max-width:700px}.hero p{margin:0;color:#d8d2e8;max-width:630px;line-height:1.65}.hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.stat{min-width:140px;padding:13px 16px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.07);backdrop-filter:blur(8px)}.stat b{display:block;font-size:24px}.stat span{font-size:13px;color:#cec7df}.progress{height:7px;background:rgba(255,255,255,.12);border-radius:20px;margin-top:9px;overflow:hidden}.progress i{display:block;width:80%;height:100%;background:linear-gradient(90deg,#d4a855,#f7db95)}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin:28px 0 18px}.toolbar h2{font:700 25px Georgia,serif;margin:0}.search{position:relative;flex:0 1 340px}.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 42px 0 14px;background:rgba(255,255,255,.9);font-size:15px;color:var(--ink);outline:none}.search input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(120,103,200,.13)}.search span{position:absolute;right:14px;top:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.book{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:14px;background:rgba(255,253,248,.94);overflow:hidden;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.book:hover{transform:translateY(-4px);border-color:#cfc3ef;box-shadow:0 14px 32px rgba(50,39,84,.12)}.cover-wrap{position:relative;aspect-ratio:4/5;background:linear-gradient(145deg,#e9e3d7,#f9f5ed);overflow:hidden}.cover-wrap img{display:block;width:100%;height:100%;object-fit:cover}.rune{position:absolute;left:10px;top:10px;padding:5px 8px;border:1px solid rgba(255,255,255,.6);border-radius:7px;background:rgba(24,20,39,.72);backdrop-filter:blur(5px);color:#fff;font-size:12px}.book-body{display:flex;flex-direction:column;flex:1;padding:15px}.status{font-size:12px;color:#65569f;font-weight:700;letter-spacing:.05em}.title{font:700 17px/1.35 Georgia,"Noto Serif KR",serif;margin:7px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.author{font-size:14px;color:var(--muted);margin-bottom:14px}.open{margin-top:auto;display:flex;align-items:center;justify-content:space-between;color:var(--ink);text-decoration:none;font-size:14px;font-weight:700;border-top:1px solid var(--line);padding-top:12px}.open:hover{color:var(--violet)}.empty{display:none;text-align:center;border:1px dashed #cfc5b4;border-radius:14px;padding:44px;color:var(--muted);background:rgba(255,255,255,.55)}.note{margin-top:24px;padding:16px 18px;border:1px solid #ded7c9;border-radius:12px;background:#fffaf0;color:#625b4e;font-size:14px;line-height:1.55}.note b{color:#8a672e}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:22px;color:var(--muted);font-size:13px}.tone-violet{box-shadow:inset 0 3px #8973d7}.tone-mint{box-shadow:inset 0 3px #5fa88b}.tone-blue{box-shadow:inset 0 3px #5289bb}.tone-gold{box-shadow:inset 0 3px #c99a51}.tone-rose{box-shadow:inset 0 3px #c57888}.tone-amber{box-shadow:inset 0 3px #d4a14a}.tone-cyan{box-shadow:inset 0 3px #4d9da8}.tone-indigo{box-shadow:inset 0 3px #5c63ac}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.shell{padding:20px 16px 38px}.source{display:none}.hero{padding:30px 24px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.toolbar{align-items:flex-start;flex-direction:column}.search{width:100%;flex-basis:auto}.footer{flex-direction:column}.hero:after{right:20px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.cover-wrap{aspect-ratio:4/4.4}.topbar{margin-bottom:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="stars"></div><main class="shell"><section class="hero"><h1>별빛 수집가의<br>마법 도서관</h1><p>아직 펼치지 않은 책은 잠든 주문서와 같습니다. 한 권씩 깨워 지혜의 별자리를 완성해 보세요.</p><div class="hero-stats"><div class="stat"><b id="totalCount">0</b><span>수집한 마도서</span></div><div class="stat"><b id="completeCount">0</b><span>완독한 마도서</span></div><div class="stat"><b id="goalPercent">0%</b><span id="goalLabel">연간 완독 목표 · 0/10</span><div class="progress"><i id="goalBar" style="width:0%"></i></div></div></div></section>
<div class="toolbar"><h2>마도서 진열장</h2><label class="search"><input id="q" type="search" aria-label="책 검색" placeholder="책 또는 저자 검색"></label></div><section id="grid" class="grid" aria-live="polite"></section><div id="empty" class="empty">찾는 마도서가 아직 이 서가에 없어요.</div>
<div class="note"><b>보호 주문 활성화:</b> 이 HTML은 데이터베이스를 읽어 만든 정적 전시관입니다. 검색과 책 열람만 가능하며 Notion 데이터베이스를 수정하지 않습니다.</div><footer class="footer"><span>기록 시작일 2026.01.01</span><span>Notion 데이터 자동 동기화</span></footer></main>
<script>
let books=[];
const grid=document.getElementById('grid'),empty=document.getElementById('empty'),q=document.getElementById('q');
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(list){grid.innerHTML=list.map(b=>`<article class="book tone-${b.tone||'indigo'}"><div class="cover-wrap"><img src="${esc(b.cover||'')}" alt="${esc(b.title)} 표지" loading="lazy"></div><div class="book-body"><div class="status">${esc(b.status||'상태 없음')}</div><h3 class="title">${esc(b.title)}</h3><div class="author">${esc(b.author||'저자 미상')}</div><a class="open" href="${esc(b.url)}" target="_blank" rel="noopener"><span>마도서 펼치기</span><span>↗</span></a></div></article>`).join('');empty.style.display=list.length?'none':'block'}
function updateStats(goal){const completed=books.filter(b=>b.status==='완독').length,rate=goal>0?Math.min(100,Math.round(completed/goal*100)):0;document.getElementById('totalCount').textContent=books.length;document.getElementById('completeCount').textContent=completed;document.getElementById('goalPercent').textContent=rate+'%';document.getElementById('goalLabel').textContent='연간 완독 목표 · '+completed+'/'+goal;document.getElementById('goalBar').style.width=rate+'%'}
async function init(){try{const [br,cr]=await Promise.all([fetch('./data/books.json?ts='+Date.now()),fetch('./data/config.json?ts='+Date.now())]);if(!br.ok||!cr.ok)throw new Error('데이터 파일을 불러오지 못했습니다.');books=await br.json();const config=await cr.json();updateStats(Number(config.goal)||0);draw(books)}catch(err){grid.innerHTML='';empty.style.display='block';empty.textContent='도서 정보를 불러오지 못했어요. GitHub Actions 실행 상태를 확인해 주세요.';console.error(err)}}
q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase();draw(books.filter(b=>(b.title+' '+b.author).toLowerCase().includes(v)))});init();
</script></body></html>
