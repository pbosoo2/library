<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>별빛 수집가의 마법 도서관</title>
<style>
:root{--ink:#211d37;--muted:#706b84;--paper:#fffdf8;--line:#e8e1d4;--violet:#7867c8;--violet-soft:#eeeafd;--gold:#bd8a3c;--night:#171427;--shadow:0 18px 60px rgba(39,31,67,.12)}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 8% 5%,#efeaff 0,transparent 28%),radial-gradient(circle at 92% 10%,#fff0d2 0,transparent 26%),#f7f3ec;min-height:100vh}.stars{position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(#806ec9 1px,transparent 1px),radial-gradient(#c59648 1px,transparent 1px);background-size:74px 74px,113px 113px;background-position:0 0,37px 21px}.shell{position:relative;max-width:1120px;margin:auto;padding:32px 28px 56px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;gap:10px;align-items:center;font-family:Georgia,serif;font-weight:700;letter-spacing:.03em}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border:1px solid #d8cda9;border-radius:50%;background:#fffaf0;color:var(--gold)}.source{font-size:14px;color:var(--muted)}.hero{overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:38px 42px;color:#fff;background:linear-gradient(125deg,#1d1933 0%,#30275a 55%,#5a4072 100%);box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;right:58px;top:46px;width:92px;height:92px;border:10px solid rgba(255,255,255,.055);outline:2px solid rgba(255,255,255,.055);outline-offset:12px;border-radius:50%}.eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#d8cef7}.hero h1{font:700 2em/1.15 Georgia,"Noto Serif KR",serif;margin:0 0 12px;max-width:700px}.hero p{margin:0;color:#d8d2e8;max-width:630px;line-height:1.65}.hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.stat{min-width:140px;padding:13px 16px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.07);backdrop-filter:blur(8px)}.stat b{display:block;font-size:24px}.stat span{font-size:13px;color:#cec7df}.progress{height:7px;background:rgba(255,255,255,.12);border-radius:20px;margin-top:9px;overflow:hidden}.progress i{display:block;width:80%;height:100%;background:linear-gradient(90deg,#d4a855,#f7db95)}.toolbar{display:flex;gap:20px;justify-content:space-between;align-items:flex-end;margin:28px 0 18px}.toolbar h2{font:700 25px Georgia,serif;margin:0}.controls{width:min(100%,520px);display:flex;flex-direction:column;gap:8px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tab{min-height:44px;padding:8px 6px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.75);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}.tab:hover{border-color:#bfb2df;color:var(--ink)}.tab[aria-selected="true"]{border-color:var(--violet);background:var(--violet-soft);color:#554595}.tab:focus-visible{outline:3px solid rgba(120,103,200,.25);outline-offset:2px}.search{position:relative;width:100%}.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 42px 0 14px;background:rgba(255,255,255,.9);font-size:15px;color:var(--ink);outline:none}.search input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(120,103,200,.13)}.search span{position:absolute;right:14px;top:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.book{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:14px;background:rgba(255,253,248,.94);overflow:hidden;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.book:hover{transform:translateY(-4px);border-color:#cfc3ef;box-shadow:0 14px 32px rgba(50,39,84,.12)}.cover-wrap{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:4/5;background:linear-gradient(145deg,#e9e3d7,#f9f5ed);overflow:hidden}.cover-wrap img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.rune{position:absolute;left:10px;top:10px;padding:5px 8px;border:1px solid rgba(255,255,255,.6);border-radius:7px;background:rgba(24,20,39,.72);backdrop-filter:blur(5px);color:#fff;font-size:12px}.book-body{display:flex;flex-direction:column;flex:1;padding:15px}.status-line{display:flex;align-items:center;gap:8px;min-height:22px}.status{font-size:12px;color:#65569f;font-weight:700;letter-spacing:.05em}.round-badge{padding:3px 7px;border:1px solid #d7cff0;border-radius:6px;background:#f2effb;color:#65569f;font-size:12px;font-weight:700}.title{font:700 17px/1.35 Georgia,"Noto Serif KR",serif;margin:7px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.author{font-size:14px;color:var(--muted);margin-bottom:14px}.open{width:100%;margin-top:auto;display:flex;align-items:center;justify-content:space-between;color:var(--ink);text-decoration:none;font:700 14px Arial,"Noto Sans KR",sans-serif;border:0;border-top:1px solid var(--line);padding:12px 0 0;background:transparent;cursor:pointer}.open:hover{color:var(--violet)}.round-dialog{width:min(92vw,480px);border:1px solid var(--line);border-radius:14px;padding:0;background:var(--paper);color:var(--ink);box-shadow:0 24px 80px rgba(25,20,45,.28)}.round-dialog::backdrop{background:rgba(23,20,39,.55);backdrop-filter:blur(3px)}.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 20px 14px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font:700 22px Georgia,"Noto Serif KR",serif}.dialog-close{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:18px;cursor:pointer}.round-list{display:flex;flex-direction:column;gap:8px;padding:16px 20px 22px}.round-link{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);text-decoration:none}.round-link:hover{border-color:var(--violet);background:var(--violet-soft)}.round-meta{display:flex;flex-direction:column;gap:3px}.round-meta b{font-size:15px}.round-meta span{font-size:13px;color:var(--muted)}.empty{display:none;text-align:center;border:1px dashed #cfc5b4;border-radius:14px;padding:44px;color:var(--muted);background:rgba(255,255,255,.55)}.note{margin-top:24px;padding:16px 18px;border:1px solid #ded7c9;border-radius:12px;background:#fffaf0;color:#625b4e;font-size:14px;line-height:1.55}.note b{color:#8a672e}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:22px;color:var(--muted);font-size:13px}.tone-violet{box-shadow:inset 0 3px #8973d7}.tone-mint{box-shadow:inset 0 3px #5fa88b}.tone-blue{box-shadow:inset 0 3px #5289bb}.tone-gold{box-shadow:inset 0 3px #c99a51}.tone-rose{box-shadow:inset 0 3px #c57888}.tone-amber{box-shadow:inset 0 3px #d4a14a}.tone-cyan{box-shadow:inset 0 3px #4d9da8}.tone-indigo{box-shadow:inset 0 3px #5c63ac}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.shell{padding:20px 16px 38px}.source{display:none}.hero{padding:30px 24px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.toolbar{align-items:flex-start;flex-direction:column}.search{width:100%;flex-basis:auto}.footer{flex-direction:column}.hero:after{right:20px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.cover-wrap{aspect-ratio:4/4.4}.topbar{margin-bottom:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="stars"></div><main class="shell"><section class="hero"><h1>별빛 수집가의<br>마법 도서관</h1><p>아직 펼치지 않은 책은 잠든 주문서와 같습니다. 한 권씩 깨워 지혜의 별자리를 완성해 보세요.</p><div class="hero-stats"><div class="stat"><b id="totalCount">0</b><span>수집한 마도서</span></div><div class="stat"><b id="completeCount">0</b><span>완독한 마도서</span></div><div class="stat"><b id="goalPercent">0%</b><span id="goalLabel">연간 완독 목표 · 0/10</span><div class="progress"><i id="goalBar" style="width:0%"></i></div></div></div></section>
<div class="toolbar"><h2>마도서 진열장</h2><div class="controls"><div class="tabs" role="tablist" aria-label="독서 상태 필터"><button class="tab" type="button" role="tab" aria-selected="true" data-status="">전체</button><button class="tab" type="button" role="tab" aria-selected="false" data-status="읽는 중">읽는 중</button><button class="tab" type="button" role="tab" aria-selected="false" data-status="읽기 전">읽기 전</button><button class="tab" type="button" role="tab" aria-selected="false" data-status="중단">중단</button><button class="tab" type="button" role="tab" aria-selected="false" data-status="완독">완독</button></div><label class="search"><input id="q" type="search" aria-label="책 검색" placeholder="책 또는 저자 검색"></label></div></div><section id="grid" class="grid" aria-live="polite"></section><div id="empty" class="empty">찾는 마도서가 아직 이 서가에 없어요.</div><dialog id="roundDialog" class="round-dialog"><div class="dialog-head"><h2 id="dialogTitle">회차 선택</h2><button id="dialogClose" class="dialog-close" type="button" aria-label="닫기">×</button></div><div id="roundList" class="round-list"></div></dialog>
<div class="note"><b>보호 주문 활성화:</b> 이 HTML은 데이터베이스를 읽어 만든 정적 전시관입니다. 검색과 책 열람만 가능하며 Notion 데이터베이스를 수정하지 않습니다.</div><footer class="footer"><span>기록 시작일 2026.01.01</span><span>Notion 데이터 자동 동기화</span></footer></main>
<script>
let books=[],activeStatus='';
const grid=document.getElementById('grid'),empty=document.getElementById('empty'),q=document.getElementById('q');
const roundDialog=document.getElementById('roundDialog'),dialogTitle=document.getElementById('dialogTitle'),roundList=document.getElementById('roundList');
const statusOrder={'읽는 중':0,'읽기 전':1,'중단':2,'완독':3};
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openRounds(index){const book=books[index];if(!book)return;dialogTitle.textContent=book.title;const rounds=[...(book.rounds||[])].sort((a,b)=>b.round-a.round);roundList.innerHTML=rounds.map(item=>`<a class="round-link" href="${esc(item.url)}" target="_blank" rel="noopener"><span class="round-meta"><b>${item.round}회차</b><span>${esc(item.status||'상태 없음')}${item.completedDate?' · 완독 '+esc(item.completedDate):''}</span></span><span>↗</span></a>`).join('');roundDialog.showModal()}
function draw(list){grid.innerHTML=list.map(b=>{const index=books.indexOf(b),round=Number(b.round)||1;return `<article class="book tone-${b.tone||'indigo'}" data-index="${index}" tabindex="0" role="button" aria-label="${esc(b.title)} 회차 선택"><div class="cover-wrap"><img src="${esc(b.cover||'')}" alt="${esc(b.title)} 표지" loading="lazy"></div><div class="book-body"><div class="status-line"><div class="status">${esc(b.status||'상태 없음')}</div>${round>=2?`<span class="round-badge">${round}회차</span>`:''}</div><h3 class="title">${esc(b.title)}</h3><div class="author">${esc(b.author||'저자 미상')}</div><button class="open rounds-open" type="button" data-index="${index}"><span>${round>=2?'회차 선택':'마도서 펼치기'}</span><span>↗</span></button></div></article>`}).join('');empty.style.display=list.length?'none':'block';grid.querySelectorAll('.rounds-open').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();openRounds(Number(button.dataset.index))}));grid.querySelectorAll('.book').forEach(card=>{card.addEventListener('click',()=>openRounds(Number(card.dataset.index)));card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openRounds(Number(card.dataset.index))}})})}
function refresh(){const v=q.value.trim().toLowerCase();draw(books.filter(b=>(!activeStatus||b.status===activeStatus)&&(b.title+' '+b.author).toLowerCase().includes(v)))}
function updateStats(goal){const allRounds=books.flatMap(b=>b.rounds||[]),completed=allRounds.filter(item=>item.status==='완독').length,currentYear=new Date().getFullYear(),annualCompleted=allRounds.filter(item=>item.status==='완독'&&item.completedDate&&new Date(item.completedDate).getFullYear()===currentYear).length,rate=goal>0?Math.min(100,Math.round(annualCompleted/goal*100)):0;document.getElementById('totalCount').textContent=books.length;document.getElementById('completeCount').textContent=completed;document.getElementById('goalPercent').textContent=rate+'%';document.getElementById('goalLabel').textContent=currentYear+'년 완독 목표 · '+annualCompleted+'/'+goal;document.getElementById('goalBar').style.width=rate+'%'}
async function init(){try{const [br,cr]=await Promise.all([fetch('./data/books.json?ts='+Date.now()),fetch('./data/config.json?ts='+Date.now())]);if(!br.ok||!cr.ok)throw new Error('데이터 파일을 불러오지 못했습니다.');const raw=await br.json();books=raw.map(b=>({...b,round:Number(b.round)||1,rounds:Array.isArray(b.rounds)&&b.rounds.length?b.rounds:[{round:Number(b.round)||1,status:b.status,completedDate:b.completedDate||null,url:b.url,createdTime:b.createdTime}]})).sort((a,b)=>(statusOrder[a.status]??99)-(statusOrder[b.status]??99)||new Date(b.createdTime||0)-new Date(a.createdTime||0));const config=await cr.json();updateStats(Number(config.goal)||0);refresh()}catch(err){grid.innerHTML='';empty.style.display='block';empty.textContent='도서 정보를 불러오지 못했어요. GitHub Actions 실행 상태를 확인해 주세요.';console.error(err)}}
q.addEventListener('input',refresh);document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{activeStatus=tab.dataset.status;document.querySelectorAll('.tab').forEach(item=>item.setAttribute('aria-selected',String(item===tab)));refresh()}));document.getElementById('dialogClose').addEventListener('click',()=>roundDialog.close());roundDialog.addEventListener('click',event=>{if(event.target===roundDialog)roundDialog.close()});init();
</script></body></html>
