name: Sync Notion Library

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-notion-library
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Read Notion and refresh site data
        run: node scripts/sync-notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Commit refreshed data
        run: |
          git config user.name "notion-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data assets/covers
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync Notion library"
            git push
          fi
